plugins {
    id 'org.jetbrains.kotlin.jvm' version '1.9.25'
    id 'org.jetbrains.kotlin.plugin.spring' version '1.9.25'
    id 'org.springframework.boot' version '3.5.7'
    id 'io.spring.dependency-management' version '1.1.7'
}

group = 'org.vish'
version = '0.0.1-SNAPSHOT'
description = 'hollowdemo'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

configurations {
    compileOnly {
        extendsFrom annotationProcessor
    }
    // codegen source set inherits all runtime deps (hollow, kotlin-reflect, etc.)
    codegenImplementation.extendsFrom implementation
    codegenRuntimeOnly.extendsFrom runtimeOnly
}

repositories {
    mavenCentral()
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'com.fasterxml.jackson.module:jackson-module-kotlin'
    implementation 'org.jetbrains.kotlin:kotlin-reflect'

    // Hollow for versioned dataset distribution
    implementation 'com.netflix.hollow:hollow:7.14.39'
    implementation 'io.github.vichu.hollow:hollow-aws:0.1.0'

    // Deterministic fake data generation for demo datasets
    implementation 'net.datafaker:datafaker:2.4.2'

    developmentOnly 'org.springframework.boot:spring-boot-devtools'
    annotationProcessor 'org.springframework.boot:spring-boot-configuration-processor'
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.jetbrains.kotlin:kotlin-test-junit5'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

// codegen source set: model classes (Movie, User) + generator runners.
// Compiled independently so generators can run before the main source set,
// breaking the cycle: main needs generated API → generators need model classes.
sourceSets {
    codegen {
        kotlin { srcDir 'src/codegen/kotlin' }
        java { srcDir 'src/codegen/java' }
    }
    main {
        // Model classes (Movie, User) live in codegen; add to main's classpath
        // so producers, controllers, and tests can reference them normally.
        compileClasspath += sourceSets.codegen.output
        runtimeClasspath += sourceSets.codegen.output
    }
}

kotlin {
    compilerOptions {
        freeCompilerArgs.addAll '-Xjsr305=strict'
    }
}

tasks.named('test') {
    useJUnitPlatform()
}

// Explicitly set the main class for Spring Boot
springBoot {
    mainClass = 'org.vish.hollowdemo.HollowdemoApplicationKt'
}

// Generate Hollow Consumer API for the catalog (movies) dataset.
// Depends only on codegenClasses — avoids the circular dependency on classes.
task generateHollowAPI(type: JavaExec) {
    group = 'hollow'
    description = 'Generate Hollow Consumer API classes for catalog dataset'
    mainClass = 'org.vish.hollowdemo.codegen.GenerateMovieAPI'
    classpath = sourceSets.codegen.runtimeClasspath
    dependsOn codegenClasses
}

// Generate Hollow Consumer API for the users dataset.
task generateUserAPI(type: JavaExec) {
    group = 'hollow'
    description = 'Generate Hollow Consumer API classes for users dataset'
    mainClass = 'org.vish.hollowdemo.codegen.GenerateUserAPI'
    classpath = sourceSets.codegen.runtimeClasspath
    dependsOn codegenClasses
}

// Convenience: regenerate both APIs in one shot
task generateAllAPIs {
    group = 'hollow'
    description = 'Generate Hollow Consumer API classes for all datasets'
    dependsOn generateHollowAPI, generateUserAPI
}

// Main compilation depends on generated API being present first.
compileKotlin.dependsOn generateAllAPIs
compileJava.dependsOn generateAllAPIs

task measureJsonSize(type: JavaExec) {
    group = 'hollow'
    description = 'Measure uncompressed and gzipped JSON size vs Hollow snapshot for both datasets'
    mainClass = 'org.vish.hollowdemo.codegen.MeasureJsonSize'
    classpath = sourceSets.main.runtimeClasspath
    dependsOn classes
}

// Task to cleanup Hollow data directory
task cleanupHollowData {
    group = 'hollow'
    description = 'Clean up the hollow-data directory'
    doLast {
        def hollowDataDir = file('./hollow-data')
        if (hollowDataDir.exists()) {
            println "Deleting hollow-data directory..."
            delete hollowDataDir
            println "✅ Hollow data directory cleaned successfully!"
        } else {
            println "⚠️  No hollow-data directory found. Nothing to clean up."
        }
    }
}
